[project]
name = "laser-sweep"
version = "0.1.0"
description = "Generate GRBL laser parameter sweep gcode (spot size, speed, power)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
laser-sweep = "laser_sweep.cli:main"
laser-backlash = "laser_sweep.postprocess:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laser_sweep"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
